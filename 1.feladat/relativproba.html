<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatív Prímek Keresője (2–100)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --error: #ef4444;
            --success: #22c55e;
            --badge-bg: #e0e7ff;
            --badge-text: #3730a3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--text-main);
            text-align: center;
        }

        p.description {
            color: var(--text-muted);
            font-size: 0.95rem;
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="number"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #error-msg {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: -5px;
            margin-bottom: 15px;
            display: none;
        }

        .result-section {
            margin-top: 25px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
            display: none;
        }

        .result-stats {
            font-size: 0.95rem;
            margin-bottom: 15px;
            color: var(--text-muted);
        }

        .result-stats strong {
            color: var(--text-main);
        }

        .badge-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Relatív Prímek Keresője</h1>
        <p class="description">Adj meg egy egész számot <strong>2 és 100 között</strong>, és a program megkeresi az összes vele relatív prím számot 2-től 100-ig.</p>

        <div class="input-group">
            <input type="number" id="numInput" placeholder="Írj be egy számot (2-100)" min="1" max="200">
            <button id="calcBtn">Számolás</button>
        </div>
        <div id="error-msg"></div>

        <div class="result-section" id="resultSection">
            <div class="result-stats" id="resultStats"></div>
            <div class="badge-grid" id="badgeGrid"></div>
        </div>
    </div>

    <script>
        // Legnagyobb közös osztó (LnKO) kiszámítása Euklideszi algoritmussal
        function lnko(a, b) {
            while (b !== 0) {
                let temp = b;
                b = a % b;
                a = temp;
            }
            return a;
        }

        const numInput = document.getElementById('numInput');
        const calcBtn = document.getElementById('calcBtn');
        const errorMsg = document.getElementById('error-msg');
        const resultSection = document.getElementById('resultSection');
        const resultStats = document.getElementById('resultStats');
        const badgeGrid = document.getElementById('badgeGrid');

        function processInput() {
            // Rejtjük az előző hibát/eredményt
            errorMsg.style.display = 'none';
            resultSection.style.display = 'none';

            const value = numInput.value.trim();

            // Ellenőrzés, hogy üres-e vagy nem szám
            if (value === '' || isNaN(value)) {
                showError('Kérlek adj meg egy érvényes egész számot!');
                return;
            }

            const num = Number(value);

            // Tartomány ellenőrzés (2 és 100 között)
            if (num < 2 || num > 100) {
                showError('A megadott számnak 2 és 100 között kell lennie!');
                return;
            }

            // Relatív prímek gyűjtése 2-től 100-ig
            const relatives = [];
            for (let i = 2; i <= 100; i++) {
                if (lnko(num, i) === 1) {
                    relatives.push(i);
                }
            }

            // Eredmények megjelenítése
            resultStats.innerHTML = `A(z) <strong>${num}</strong> számhoz relatív prímek (2 és 100 között): <strong>${relatives.length} db</strong>`;
            
            badgeGrid.innerHTML = '';
            relatives.forEach(n => {
                const badge = document.createElement('div');
                badge.className = 'badge';
                badge.textContent = n;
                badgeGrid.appendChild(badge);
            });

            resultSection.style.display = 'block';
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
        }

        calcBtn.addEventListener('click', processInput);
        numInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                processInput();
            }
        });
    </script>

</body>
</html>
