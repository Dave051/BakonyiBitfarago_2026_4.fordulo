<body>
    <div class="techtrio">TechTrio</div>

    <h1>Itt a piros, hol a piros</h1>
    <h2 id="msg">Kattints az indításra!</h2>
    <div id="controls">
        <label for="speed">Sebesség:</label>
        <select id="speed">
            <option value="800">Lassú</option>
            <option value="400" selected>Normál</option>
            <option value="150">Gyors</option>
        </select>
        <button id="start-btn">Indítás</button>
    </div>
    <div id="game-board">
        <div class="card" id="card-0" style="left: 20px;"></div>
        <div class="card" id="card-1" style="left: 160px;"></div>
        <div class="card" id="card-2" style="left: 300px;"></div>
    </div>

    <footer class="feladat-lablec">
